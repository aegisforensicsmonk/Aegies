version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: ciip-db
    environment:
      POSTGRES_DB: ciip_db
      POSTGRES_USER: ciip
      POSTGRES_PASSWORD: ciip_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ciip -d ciip_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ciip-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ciip-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ciip
      RABBITMQ_DEFAULT_PASS: ciip_secure_password
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: ciip-minio
    environment:
      MINIO_ROOT_USER: ciip_admin
      MINIO_ROOT_PASSWORD: ciip_secure_password
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Console port
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch
  elasticsearch:
    image: elasticsearch:8.13.4
    container_name: ciip-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5-community
    container_name: ciip-neo4j
    environment:
      NEO4J_AUTH: neo4j/ciip_secure_password
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "ciip_secure_password", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ciip-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://ciip:ciip_secure_password@db:5432/ciip_db
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://ciip:ciip_secure_password@rabbitmq:5672/
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ciip_admin
      MINIO_SECRET_KEY: ciip_secure_password
      MINIO_SECURE: "false"
      ELASTICSEARCH_URL: http://elasticsearch:9200
      osintfootprints_HOST: ciip-osintfootprints
      SECRET_KEY: ciip-production-secret-change-me
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ciip_secure_password
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SANDBOX_API_URL: http://cape_sandbox:8090/apiv2
      SANDBOX_API_KEY: mock-api-key
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      neo4j:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Celery Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ciip-celery-worker
    environment:
      DATABASE_URL: postgresql+asyncpg://ciip:ciip_secure_password@db:5432/ciip_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ciip_secure_password
      SECRET_KEY: ciip-production-secret-change-me
      SANDBOX_API_URL: http://cape_sandbox:8090/apiv2
      SANDBOX_API_KEY: mock-api-key
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    command: celery -A app.worker.celery_app worker --loglevel=info

  # Celery Worker (Isolated Reverse Engineering VM Mock)
  re_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ciip-re-worker
    environment:
      DATABASE_URL: postgresql+asyncpg://ciip:ciip_secure_password@db:5432/ciip_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_app worker -Q re_vm_queue --loglevel=info --concurrency=2

  # Next.js Frontend (Now Vite)
  frontend:
    build:
      context: ./frontend-vite
      dockerfile: Dockerfile
    container_name: ciip-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend-vite:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    command: npm run dev

  # osintfootprints OSINT Lab
  osintfootprints:
    build:
      context: ./osintfootprints
      dockerfile: Dockerfile
    container_name: ciip-osintfootprints
    ports:
      - "5001:5001"
    volumes:
      - ./osintfootprints:/home/osintfootprints

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  elasticsearch_data:
  neo4j_data:
